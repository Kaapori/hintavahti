name: Aja Hintavahti

on:
  schedule:
    # Ajaa skriptin 6 tunnin välein (klo 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Mahdollistaa ajamisen käsin milloin vain

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Hae koodi repositoriosta
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Asenna riippuvuudet
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Aja hintavahti.py
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          PRICE_LIMIT: ${{ secrets.PRICE_LIMIT }}
        run: python hintavahti.py
